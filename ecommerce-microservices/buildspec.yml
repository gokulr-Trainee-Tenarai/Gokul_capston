version: 0.2


phases:
  install:
    commands:
      - echo "Setting up Go environment..."
      - cd ecommerce-microservices || true
      - mkdir -p /tmp/go-cache
      - go version
  pre_build:
    commands:
      - cd ecommerce-microservices || true
      - export GOCACHE=/tmp/go-cache
      - echo "Downloading dependencies and running tests..."
      - go mod download
      - echo "Running race-condition unit tests..."
      - go test -race ./tests/...
  build:
    commands:
      - cd ecommerce-microservices || true
      - export GOCACHE=/tmp/go-cache
      - echo "Compiling Go binaries for Linux..."
      - mkdir -p bin
      - GOOS=linux GOARCH=amd64 go build -o bin/gateway ./gateway/main.go
      - GOOS=linux GOARCH=amd64 go build -o bin/order-service ./services/order/main.go
      - GOOS=linux GOARCH=amd64 go build -o bin/product-service ./services/product/main.go


artifacts:
  base-directory: ecommerce-microservices
  files:
    - bin/gateway
    - bin/order-service
    - bin/product-service
    - Procfile
    - schema.sql